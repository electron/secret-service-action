name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  integration-test:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/integration-test.yml

  release:
    name: release
    runs-on: ubuntu-latest
    needs: integration-test
    environment: release
    permissions:
      contents: write # for making github release
      pull-requests: write # for commenting release version
      issues: write # for commenting release version
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Run semantic release
        uses: electron/semantic-trusted-release@2a7b16df83a1f77339ad473654c5fbd2b32b193b # v1.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
