name: OIDC Secret Exchange
description: Exchange GitHub Actions OIDC token for secrets

inputs:
  endpoint:
    description: The secret service endpoint to exchange the OIDC token for secrets
    required: false
    default: https://electron-secret-service-dc455692df42.herokuapp.com/exchange

outputs:
  secrets:
    description: The returned secrets (masked in GHA) in JSON format
    value: ${{ steps.exchange.outputs.secrets }}

runs:
  using: composite
  steps:
    - name: Exchange OIDC token for secrets
      id: exchange
      shell: bash
      env:
        AUDIENCE: electron-secret-service
        SECRETS_ENDPOINT: ${{ inputs.endpoint }}
      run: |
        set -euo pipefail
        # Request GitHub OIDC token with custom audience
        OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value // empty')
        if [[ -z "$OIDC_TOKEN" ]]; then
          echo "::error::Failed to get OIDC token from GitHub"
          exit 1
        fi
        # Exchange OIDC token for secrets
        RESPONSE=$(curl -sS -X POST \
          -H "Content-Type: application/json" \
          -w "\n%{http_code}" \
          -d '{"token":"'$OIDC_TOKEN'"}' \
          "$SECRETS_ENDPOINT")
        # Extract status code and body
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        if [[ "$HTTP_CODE" != "200" ]]; then
          echo "::error::Failed to exchange token. Status: $HTTP_CODE"
          exit 1
        fi
        # Validate the response is a flat JSON object whose every value is a string,
        # then re-serialize it canonically (compact) with jq. Fail closed on any other
        # shape (invalid JSON, bare string, array, nested/wrapped object, non-string
        # values) so we never publish a body for which masks were not registered.
        # 2>/dev/null prevents jq from echoing offending response content into the log.
        if ! CANONICAL=$(echo "$BODY" | jq -ce \
            'if (type == "object") and ([.[] | type] | all(. == "string")) then . else error end' \
            2>/dev/null); then
          echo "::error::Secret service returned an unexpected response shape; aborting to prevent secret leakage"
          exit 1
        fi
        # A single valid JSON object always serializes to one line; a literal newline
        # here means the body contained multiple concatenated top-level values (trailing
        # bytes). Reject it: it would also write malformed multi-line data to the output.
        if [[ "$CANONICAL" == *$'\n'* ]]; then
          echo "::error::Secret service response contained trailing data; aborting to prevent secret leakage"
          exit 1
        fi
        # add_mask registers each value. Workflow-command data is unescaped by the runner
        # (%25->% %0D->CR %0A->LF), so we percent-encode those bytes; this also prevents a
        # CR in a value from terminating the ::add-mask:: line early and injecting a command
        # (e.g. ::stop-commands::) that would disable masking for the remaining secrets.
        emit_mask() {
          local v="${1//%/%25}"
          v="${v//$'\r'/%0D}"
          v="${v//$'\n'/%0A}"
          echo "::add-mask::$v"
        }
        # Mask the exact bytes each secret occupies inside the emitted JSON. @json yields
        # the value's serialized form (quoted); stripping the quotes gives the precise
        # substring present in CANONICAL, so redaction does not depend on the runner's
        # masker independently re-deriving jq's escaping.
        readarray -t SERIALIZED < <(echo "$CANONICAL" | jq -r '.[] | @json')
        for s in "${SERIALIZED[@]}"; do
          emit_mask "${s:1:-1}"
        done
        # Also mask the decoded value, for consumers that parse the output (e.g.
        # fromJSON(...).TOKEN) and print the raw secret.
        readarray -t DECODED < <(echo "$CANONICAL" | jq -r '.[]')
        for d in "${DECODED[@]}"; do
          emit_mask "$d"
        done
        echo "secrets=$CANONICAL" >> $GITHUB_OUTPUT
